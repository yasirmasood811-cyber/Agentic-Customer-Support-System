<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b54708"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#1d2939">Agentic AI Customer Support System: Architecture</text>

  <!-- Row A: frontend -->
  <rect x="60" y="60" width="520" height="70" rx="12" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="320" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2939">Customer chat (React + Vite)</text>
  <text x="320" y="110" text-anchor="middle" font-size="13" fill="#344054">streaming replies, action cards, escalation banner</text>
  <rect x="620" y="60" width="520" height="70" rx="12" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="880" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2939">Admin page (/#admin, password login)</text>
  <text x="880" y="110" text-anchor="middle" font-size="13" fill="#344054">tickets, orders, status update + message to customer</text>

  <line x1="320" y1="130" x2="320" y2="168" stroke="#475467" stroke-width="2" marker-end="url(#arr)"/>
  <text x="332" y="154" font-size="12" fill="#475467">POST /api/chat (SSE)</text>
  <line x1="880" y1="130" x2="880" y2="168" stroke="#475467" stroke-width="2" marker-end="url(#arr)"/>
  <text x="892" y="154" font-size="12" fill="#475467">token-protected API</text>

  <!-- Row B: FastAPI -->
  <rect x="60" y="170" width="1080" height="64" rx="12" fill="#f4ebff" stroke="#7a3fd0" stroke-width="1.5"/>
  <text x="600" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2939">FastAPI backend</text>
  <text x="600" y="219" text-anchor="middle" font-size="13" fill="#344054">/api/chat  •  /api/admin/login  •  /api/tickets  •  /api/orders   |   CORS, admin token, login rate limit, 503/429 retry</text>

  <line x1="600" y1="234" x2="600" y2="274" stroke="#475467" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Row C: LangGraph -->
  <rect x="60" y="276" width="1080" height="236" rx="14" fill="#f9fafb" stroke="#98a2b3" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="76" y="300" font-size="14" font-weight="700" fill="#344054">LangGraph orchestration (state + memory per conversation)</text>
  <text x="1124" y="300" text-anchor="end" font-size="13" fill="#344054">LLM: Google Gemini (router and all agents)</text>

  <rect x="490" y="312" width="240" height="46" rx="10" fill="#fff4e5" stroke="#d97706" stroke-width="1.5"/>
  <text x="610" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2939">Router (triage)</text>

  <!-- router arrows -->
  <line x1="560" y1="358" x2="200" y2="396" stroke="#475467" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="630" y1="358" x2="750" y2="396" stroke="#475467" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="660" y1="358" x2="1020" y2="396" stroke="#475467" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="260" y="365" width="80" height="18" fill="#f9fafb"/><text x="300" y="378" text-anchor="middle" font-size="12" fill="#475467">policy / FAQ</text>
  <rect x="542" y="377" width="158" height="18" fill="#f9fafb"/><text x="700" y="390" text-anchor="end" font-size="12" fill="#475467">order, refund, ticket status</text>
  <rect x="921" y="363" width="128" height="18" fill="#f9fafb"/><text x="985" y="376" text-anchor="middle" font-size="12" fill="#475467">angry / human / legal</text>

  <!-- agents -->
  <rect x="80" y="398" width="220" height="64" rx="10" fill="#e6f6ef" stroke="#12805c" stroke-width="1.5"/>
  <text x="190" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2939">Knowledge Agent</text>
  <text x="190" y="446" text-anchor="middle" font-size="12" fill="#344054">answers from the knowledge base</text>

  <rect x="360" y="398" width="220" height="64" rx="10" fill="#e6f6ef" stroke="#12805c" stroke-width="1.5"/>
  <text x="470" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2939">Email Agent</text>
  <text x="470" y="446" text-anchor="middle" font-size="12" fill="#344054">confirmation email to customer</text>

  <rect x="640" y="398" width="220" height="64" rx="10" fill="#e6f6ef" stroke="#12805c" stroke-width="1.5"/>
  <text x="750" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2939">Action Agent</text>
  <text x="750" y="446" text-anchor="middle" font-size="12" fill="#344054">verify, status, refund, updates</text>

  <rect x="920" y="398" width="220" height="64" rx="10" fill="#fdecea" stroke="#b42318" stroke-width="1.5"/>
  <text x="1030" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2939">Escalation Agent</text>
  <text x="1030" y="446" text-anchor="middle" font-size="12" fill="#344054">ticket + hand-off to a human</text>

  <!-- action -> email / escalate -->
  <line x1="640" y1="430" x2="582" y2="430" stroke="#475467" stroke-width="2" marker-end="url(#arr)"/>
  <text x="611" y="422" text-anchor="middle" font-size="11" fill="#475467">success</text>
  <line x1="860" y1="430" x2="918" y2="430" stroke="#b54708" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
  <text x="889" y="422" text-anchor="middle" font-size="11" fill="#b54708">over $200</text>

  <text x="600" y="492" text-anchor="middle" font-size="11.5" fill="#475467">Code (not the LLM) decides: orders open only after the email-code check  •  email only after a successful refund or update  •  escalate above the limit</text>

  <!-- Row D: tools -->
  <line x1="190" y1="462" x2="190" y2="548" stroke="#475467" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="470" y1="462" x2="470" y2="548" stroke="#475467" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="750" y1="462" x2="750" y2="548" stroke="#475467" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="1030" y1="462" x2="1030" y2="548" stroke="#475467" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="80" y="550" width="220" height="64" rx="10" fill="#ffffff" stroke="#667085" stroke-width="1.3"/>
  <text x="190" y="577" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2939">search_knowledge_base</text>
  <text x="190" y="597" text-anchor="middle" font-size="12" fill="#344054">semantic search (RAG)</text>

  <rect x="360" y="550" width="220" height="64" rx="10" fill="#ffffff" stroke="#667085" stroke-width="1.3"/>
  <text x="470" y="577" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2939">send_email</text>
  <text x="470" y="597" text-anchor="middle" font-size="12" fill="#344054">SMTP</text>

  <rect x="640" y="550" width="220" height="64" rx="10" fill="#ffffff" stroke="#667085" stroke-width="1.3"/>
  <text x="750" y="570" text-anchor="middle" font-size="11" font-weight="700" fill="#1d2939">request/confirm_verification,</text>
  <text x="750" y="587" text-anchor="middle" font-size="11" font-weight="700" fill="#1d2939">get_order_status, process_refund,</text>
  <text x="750" y="604" text-anchor="middle" font-size="11" font-weight="700" fill="#1d2939">update_record, check_ticket_status</text>

  <rect x="920" y="550" width="220" height="64" rx="10" fill="#ffffff" stroke="#667085" stroke-width="1.3"/>
  <text x="1030" y="577" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2939">escalate_to_human</text>
  <text x="1030" y="597" text-anchor="middle" font-size="12" fill="#344054">ticket + team notification</text>

  <!-- Row E: services -->
  <line x1="190" y1="614" x2="190" y2="682" stroke="#475467" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="470" y1="614" x2="470" y2="682" stroke="#475467" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="750" y1="614" x2="750" y2="682" stroke="#475467" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="1030" y1="614" x2="1030" y2="682" stroke="#475467" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="80" y="684" width="220" height="80" rx="10" fill="#fff8e1" stroke="#b7791f" stroke-width="1.5"/>
  <text x="190" y="712" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2939">ChromaDB</text>
  <text x="190" y="732" text-anchor="middle" font-size="12" fill="#344054">policy chunks + local</text>
  <text x="190" y="749" text-anchor="middle" font-size="12" fill="#344054">MiniLM embeddings</text>

  <rect x="360" y="684" width="220" height="80" rx="10" fill="#fff8e1" stroke="#b7791f" stroke-width="1.5"/>
  <text x="470" y="712" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2939">Gmail SMTP</text>
  <text x="470" y="732" text-anchor="middle" font-size="12" fill="#344054">emails to customers</text>
  <text x="470" y="749" text-anchor="middle" font-size="12" fill="#344054">(Reply-To: support team)</text>

  <rect x="640" y="684" width="220" height="80" rx="10" fill="#fff8e1" stroke="#b7791f" stroke-width="1.5"/>
  <text x="750" y="712" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2939">PostgreSQL + Stripe</text>
  <text x="750" y="732" text-anchor="middle" font-size="12" fill="#344054">orders, customers</text>
  <text x="750" y="749" text-anchor="middle" font-size="12" fill="#344054">payments + refunds (test mode)</text>

  <rect x="920" y="684" width="220" height="80" rx="10" fill="#fff8e1" stroke="#b7791f" stroke-width="1.5"/>
  <text x="1030" y="712" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2939">PostgreSQL + Gmail</text>
  <text x="1030" y="732" text-anchor="middle" font-size="12" fill="#344054">tickets table, alert to</text>
  <text x="1030" y="749" text-anchor="middle" font-size="12" fill="#344054">the support team inbox</text>
</svg>
